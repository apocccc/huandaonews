services:
  db:
    image: postgres:16-alpine
    container_name: huandaonews-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: huandaonews
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d huandaonews"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
